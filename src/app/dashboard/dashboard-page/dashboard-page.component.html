@if (isLoading) {
  <div>
    <app-loader></app-loader>
  </div>
} @else {
  <div class="flex justify-center">
    <div class="mt-2 flex flex-col lg:flex-row justify-center gap-2">
      <div class="w-full lg:w-1/2">
        <div class="mb-3 flex items-center justify-between">
          <h1 class="text-start text-2xl font-bold">Dashboard</h1>
          <div class="relative flex items-center gap-2">
            <button
              (click)="toggleDateSelector(); preventCloseOnClick()"
              hlmBtn
              variant="outline"
              size="icon"
              [hlmTooltip]="'Select date range'"
              position="bottom"
              class="hidden md:inline-flex"
            >
              <ng-icon name="lucideCalendarDays" />
            </button>
            @if (showDateSelector) {
              <div
                (click)="preventCloseOnClick()"
                class="absolute right-0 top-12 z-50 hidden md:flex items-center justify-center rounded-lg border border-border bg-popover p-3 shadow-md"
              >
                <app-date-selector></app-date-selector>
              </div>
            }
            <app-transaction-form-buttons></app-transaction-form-buttons>
          </div>
        </div>
        <div class="mb-3 grid grid-cols-2 xl:grid-cols-3 gap-y-2 gap-x-4">
          @for (statCard of statCards; track statCard) {
            <div>
              <app-stat-card
                [title]="statCard.title"
                [value]="statCard.value"
                [percentChange]="statCard.percentChange"
                [isIncome]="statCard.isIncome"
              ></app-stat-card>
            </div>
          }
        </div>
        <app-transaction-table
          [transactions]="allTransactions"
          [showFilter]="true"
        ></app-transaction-table>
      </div>
      <div class="mt-3 w-full lg:mt-0 lg:w-1/2 lg:mx-2">
        <app-line-bar-chart
          title="Total Ins"
          class="mb-3 block"
          percentChangeMessage="Previous gains:"
          [data]="incomeLineBarData"
          [isIncome]="true"
        ></app-line-bar-chart>
        <app-line-bar-chart
          title="Total Outs"
          percentChangeMessage="Previous dip:"
          [data]="expenseLineBarData"
          [isIncome]="false"
        ></app-line-bar-chart>
      </div>
    </div>
  </div>
}
