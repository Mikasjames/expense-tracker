<div class="app-container">
  <aside class="hidden md:block">
    <app-sidebar [sidebarItems]="sidebarContent"></app-sidebar>
  </aside>
  @if (showSidebar) {
    <aside
      (click)="preventCloseOnClick()"
      class="sidebar-transition z-[1002] md:hidden"
    >
      <app-sidebar [sidebarItems]="sidebarContent"></app-sidebar>
    </aside>
  }
  <header class="md:hidden">
    <app-topbar
      [showSidebar]="showSidebar"
      (toggleSidebar)="toggleSidebar($event); preventCloseOnClick()"
    ></app-topbar>
  </header>

  <main
    class="main-content md:ml-16"
    [ngClass]="{ 'dim-content': showSidebar }"
  >
    <router-outlet></router-outlet>
  </main>
</div>
