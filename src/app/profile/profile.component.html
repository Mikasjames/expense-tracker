<div class="py-5">
  <div class="flex justify-center">
    <div class="w-full lg:w-2/3">
      <h1 class="mb-4 text-2xl font-bold">Profile</h1>

      <hlm-card class="mb-4">
        <div hlmCardContent class="flex flex-col items-center py-5 text-center">
          <div
            class="mb-3 flex h-20 w-20 items-center justify-center rounded-full bg-amber-600 text-3xl font-bold text-white"
          >
            {{ initials }}
          </div>
          <h4 class="mb-1">{{ user?.username || "User" }}</h4>
          <p class="text-muted-foreground">{{ user?.email }}</p>
        </div>
      </hlm-card>

      <hlm-card class="mb-4">
        <hlm-card-header>
          <h3 hlmCardTitle>Account Information</h3>
        </hlm-card-header>
        <div hlmCardContent class="space-y-3">
          <div>
            <label class="mb-1 block text-sm text-muted-foreground">Email</label>
            <p class="text-base">{{ user?.email }}</p>
          </div>

          <div>
            <label class="mb-1 block text-sm text-muted-foreground">Username</label>
            @if (!editingUsername) {
              <div class="flex items-center gap-2">
                <span class="text-base">{{ user?.username }}</span>
                <button hlmBtn variant="outline" size="icon-sm" (click)="startEdit()">
                  <ng-icon name="lucidePencil" />
                </button>
              </div>
            } @else {
              <div class="flex items-center gap-2">
                <input
                  hlmInput
                  class="w-40"
                  [(ngModel)]="usernameInput"
                  (keyup.enter)="saveUsername()"
                  placeholder="Enter username"
                />
                <button
                  hlmBtn
                  variant="default"
                  size="sm"
                  (click)="saveUsername()"
                  [disabled]="saving || !usernameInput.trim()"
                >
                  @if (saving) {
                    <hlm-spinner size="xs" class="mr-1" />
                  }
                  @if (!saving) {
                    <span>Save</span>
                  }
                </button>
                <button hlmBtn variant="outline" size="sm" (click)="cancelEdit()">
                  Cancel
                </button>
              </div>
              @if (saved) {
                <span class="mt-1 block text-sm text-emerald-600">
                  <ng-icon name="lucideCheckCircle" class="mr-1" />
                  Username updated
                </span>
              }
            }
          </div>
        </div>
      </hlm-card>

      <hlm-card>
        <hlm-card-header>
          <h3 hlmCardTitle>Role</h3>
        </hlm-card-header>
        <div hlmCardContent>
          <span hlmBadge [variant]="user?.isAdmin ? 'default' : 'secondary'">
            {{ user?.isAdmin ? "Admin" : "User" }}
          </span>
        </div>
      </hlm-card>
    </div>
  </div>
</div>
