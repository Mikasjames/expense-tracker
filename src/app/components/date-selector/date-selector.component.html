<div class="flex w-full flex-col gap-4 md:flex-row">
  <div class="min-w-0 flex-1">
    <hlm-calendar-range
      [startDate]="startDate()"
      [endDate]="endDate()"
      (startDateChange)="onStartDateChange($event)"
      (endDateChange)="onEndDateChange($event)"
    />
  </div>
  <div class="grid w-full grid-cols-2 gap-2 md:flex md:w-36 md:shrink-0 md:flex-col">
    @for (range of presets; track range.value) {
      <button
        hlmBtn
        variant="outline"
        size="sm"
        (click)="selectRange(range.value)"
      >
        {{ range.label }}
      </button>
    }
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="col-span-2 text-destructive hover:text-destructive md:col-span-1"
      (click)="selectRange('clear')"
    >
      Clear
    </button>
  </div>
</div>
