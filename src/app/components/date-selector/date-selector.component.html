<div class="flex w-full gap-4">
  <div class="flex-1">
    <hlm-calendar-range
      [startDate]="startDate()"
      [endDate]="endDate()"
      (startDateChange)="onStartDateChange($event)"
      (endDateChange)="onEndDateChange($event)"
    />
  </div>
  <div class="flex w-36 shrink-0 flex-col gap-2">
    @for (range of presets; track range.value) {
      <button
        hlmBtn
        variant="outline"
        size="sm"
        (click)="selectRange(range.value)"
      >
        {{ range.label }}
      </button>
    }
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      class="text-destructive hover:text-destructive"
      (click)="selectRange('clear')"
    >
      Clear
    </button>
  </div>
</div>
