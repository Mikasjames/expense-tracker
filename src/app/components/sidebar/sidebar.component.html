<div class="sidebar">
  @for (item of sidebarItems; track item) {
    <div
      (click)="item.action()"
      [class]="
        item.icon === 'flex-grow-spacer' ? 'flex-grow-spacer' : 'sidebar-item'
      "
      [ngbTooltip]="item.label"
      placement="right"
    >
      <i [class]="item.icon"></i>
    </div>
  }
</div>
