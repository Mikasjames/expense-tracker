@if (selectedTag) {
  <span hlmBadge class="text-wrap">
    {{ selectedTag.name }}
    <ng-icon
      role="button"
      name="lucideXCircle"
      class="ms-1 cursor-pointer"
      (click)="removeExistingTag()"
    />
  </span>
}
@if (selectedTag === null) {
  <textarea
    hlmTextarea
    class="h-10 w-full resize-none overflow-hidden"
    id="tagIds"
    placeholder="Add a tag"
    [formControl]="tagForm"
    rows="3"
    (keydown.enter)="onEnterKey($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  ></textarea>
}

@if (isFocused) {
  <div class="relative w-1/2">
    <ul
      class="absolute z-50 mt-1 w-full list-none overflow-y-auto rounded-md border border-border bg-background p-0 shadow-md"
      style="max-height: 125px"
    >
      @if (showAddTagOption() && tagForm.value) {
        <li
          (click)="addTag(tagForm.value)"
          class="flex cursor-pointer items-center justify-between p-2 hover:bg-accent"
        >
          Add tag "{{ tagForm.value }}"
        </li>
      }
      @for (suggestion of suggestions; track suggestion) {
        <li
          [ngClass]="{ 'hover:bg-accent': true }"
          class="flex cursor-pointer items-center justify-between p-2"
          (click)="addExistingTag(suggestion)"
        >
          {{ suggestion.name }}
          <ng-icon name="lucidePlus" class="mx-1" />
        </li>
      }
    </ul>
  </div>
}
