@if (showFilter) {
  <div>
    <input
      hlmInput
      type="text"
      class="mb-2"
      id="filter-text-box"
      placeholder="Filter..."
      [formControl]="filterText"
    />
  </div>
}

<ag-grid-angular
  class="ag-theme-quartz-dark"
  style="height: 300px"
  [rowData]="rowData"
  [columnDefs]="colDefs"
  [gridOptions]="gridOptions"
  (rowDoubleClicked)="onRowDoubleClicked($event)"
  (gridReady)="onGridReady($event)"
/>
