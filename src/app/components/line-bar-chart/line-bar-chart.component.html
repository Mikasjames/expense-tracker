@if (!isLoading) {
  <div class="rounded-2xl border border-border bg-muted/50 p-4">
    <div class="m-3 flex items-start">
      <div class="w-1/2 flex flex-col items-start">
        <h3 class="font-bold">{{ title }}</h3>
        <p class="text-muted-foreground">
          {{ percentChangeMessage }}
          <span
            [class]="percentChangeClass"
            class="ms-2 font-semibold"
          >
            {{ percentChange.toFixed(0) }}%
            @if (percentChange !== 0) {
              <ng-icon [name]="percentChangeSymbol" class="ml-1" />
            }
          </span>
        </p>
      </div>
      <div class="w-1/3 flex justify-end">
        <button
          type="button"
          (click)="toggleChartType()"
          hlmBtn
          variant="outline"
          size="icon"
          [hlmTooltip]="'Toggle chart type'"
          position="bottom"
        >
          <ng-icon [name]="toggleChartTypeSymbol" />
        </button>
      </div>
    </div>
    <div>
      <div
        echarts
        [options]="options"
        [style.height]="height"
        class="demo-chart"
      ></div>
    </div>
  </div>
}
