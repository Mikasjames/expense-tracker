<div class="topbar flex h-16 w-full items-center justify-start gap-1 border-b border-sidebar-border bg-sidebar px-5 fixed top-0 z-[1000]">
  @for (item of topbarItems; track item) {
    @if (item.icon === 'flex-grow-spacer') {
      <div class="flex-grow"></div>
    } @else {
      <button
        (click)="item.action()"
        hlmBtn
        variant="ghost"
        size="icon"
        [hlmTooltip]="item.label"
        position="bottom"
        class="text-sidebar-foreground/70 hover:text-sidebar-foreground [&_ng-icon]:size-5"
      >
        <ng-icon [name]="item.icon" />
      </button>
    }
  }
</div>
