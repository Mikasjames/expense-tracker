<div class="py-5">
  <div class="flex justify-center">
    <div class="w-full lg:w-2/3">
      <h1 class="mb-4 text-2xl font-bold">Settings</h1>

      <hlm-card class="mb-4">
        <hlm-card-header>
          <h3 hlmCardTitle class="flex items-center gap-2">
            <ng-icon name="lucidePalette" />
            Preferences
          </h3>
        </hlm-card-header>
        <div hlmCardContent class="space-y-3">
          <div>
            <label class="mb-1 block text-sm text-muted-foreground">Currency</label>
            <hlm-native-select
              [value]="settings.currency"
              (valueChange)="setCurrency($event)"
              class="w-40"
            >
              <option value="PHP">PHP (&#8369;)</option>
              <option value="USD">USD (&#36;)</option>
              <option value="EUR">EUR (&euro;)</option>
            </hlm-native-select>
          </div>
          <div>
            <label class="mb-1 block text-sm text-muted-foreground">Number Format</label>
            <hlm-native-select
              [value]="settings.numberFormat"
              (valueChange)="setNumberFormat($event)"
              class="w-40"
            >
              <option value="en-US">1,234.56</option>
              <option value="de-DE">1 234,56</option>
            </hlm-native-select>
          </div>
        </div>
      </hlm-card>

      <hlm-card class="mb-4">
        <hlm-card-header>
          <h3 hlmCardTitle class="flex items-center gap-2">
            <ng-icon name="lucideBell" />
            Notifications
          </h3>
        </hlm-card-header>
        <div hlmCardContent class="space-y-2">
          <label class="flex items-center justify-between gap-4">
            <span>Email notifications</span>
            <hlm-switch
              [checked]="settings.emailNotifications"
              (checkedChange)="setEmailNotifications($event)"
            />
          </label>
          <label class="flex items-center justify-between gap-4">
            <span>Push notifications</span>
            <hlm-switch
              [checked]="settings.pushNotifications"
              (checkedChange)="setPushNotifications($event)"
            />
          </label>
          <p class="text-sm text-muted-foreground">
            Preferences are saved to your account
          </p>
        </div>
      </hlm-card>

      <hlm-card class="mb-4">
        <hlm-card-header>
          <h3 hlmCardTitle class="flex items-center gap-2">
            <ng-icon name="lucideShieldCheck" />
            Account
          </h3>
        </hlm-card-header>
        <div hlmCardContent class="flex items-center justify-between">
          <div>
            <p class="font-medium">Sign out</p>
            <p class="text-sm text-muted-foreground">
              Sign out of your account on this device
            </p>
          </div>
          <button hlmBtn variant="outline" size="sm" class="text-destructive hover:text-destructive" (click)="logout()">
            <ng-icon name="lucideLogOut" class="mr-1" />
            Logout
          </button>
        </div>
      </hlm-card>

      <hlm-card>
        <hlm-card-header>
          <h3 hlmCardTitle class="flex items-center gap-2">
            <ng-icon name="lucideInfo" />
            About
          </h3>
        </hlm-card-header>
        <div hlmCardContent class="flex justify-between">
          <span class="text-muted-foreground">App Version</span>
          <span>{{ appVersion }}</span>
        </div>
      </hlm-card>
    </div>
  </div>
</div>
