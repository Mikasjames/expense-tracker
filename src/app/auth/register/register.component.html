<app-wave class="z-0"></app-wave>
<div
  class="relative z-10 flex min-h-screen flex-col items-center justify-center bg-background px-4"
>
  <app-dollar-sign-svgs class="z-0"></app-dollar-sign-svgs>
  <div class="flex w-full max-w-xl items-center justify-center">
    <div class="w-full">
      <h1 class="text-start text-4xl font-extrabold">Register</h1>
      <h5 class="mb-4 text-base text-muted-foreground">
        Please sign up to continue
      </h5>
      <div class="relative z-10">
        <app-platform-buttons></app-platform-buttons>
      </div>
      <form [formGroup]="registerForm" (ngSubmit)="register()" class="relative z-10">
        <div class="relative my-4 text-center">
          <hr class="m-0 border-border" />
          <span
            class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-background px-2 text-muted-foreground"
            >or</span
          >
        </div>
        <div>
          <input
            hlmInput
            class="w-full rounded-b-none border-b-0"
            id="email"
            type="email"
            formControlName="email"
            placeholder="Email"
          />
        </div>
        <div class="relative">
          <input
            hlmInput
            class="w-full rounded-none border-t-0"
            id="username"
            type="text"
            formControlName="username"
            placeholder="Username"
          />
        </div>
        <div class="relative mb-4">
          <input
            hlmInput
            class="w-full rounded-t-none"
            id="password"
            type="password"
            formControlName="password"
            placeholder="Password"
          />
        </div>
        <div class="mb-3 flex justify-end">
          <button hlmBtn type="submit" class="w-1/3">
            Register
            <ng-icon name="lucideArrowRight" />
          </button>
        </div>
        <div class="text-end">
          <a
            role="button"
            (click)="navigateToLogin()"
            class="cursor-pointer text-primary underline-offset-4 hover:underline"
            >Login</a
          >
        </div>
      </form>
      @if (error) {
        <div class="mt-2 text-sm text-destructive">
          {{ error }}
        </div>
      }
    </div>
  </div>
</div>
<app-wave [wave]="'bottom'" class="z-0"></app-wave>
